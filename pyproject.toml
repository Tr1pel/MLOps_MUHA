[project]
name = "agent-platform"
version = "0.1.0"
description = "Async API foundation for reproducible virtual fly experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.7,<3",
]
dev = [
    "ruff>=0.11,<1",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "asgi-lifespan>=2.1,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a running PostgreSQL server and RUN_INTEGRATION=1"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["agent_platform"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
