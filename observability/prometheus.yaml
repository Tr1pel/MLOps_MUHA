global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Application metrics arrive by OTLP push (Collector -> /api/v1/otlp); only RabbitMQ is scraped.
scrape_configs:
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  # Per-queue gauges (ready / unacked / total / consumers) for `tasks` and `tasks.dlq`.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]
