name: CI and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: '0.13.5'
  PYTHON_VERSION: '3.12.12'

jobs:
  checks:
    name: Lint, tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: agent_platform
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ci-only-password
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group web
      - name: Lint and format check
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Repository hygiene
        run: uv run --locked pre-commit run --all-files
      - name: Unit and PostgreSQL integration tests
        run: uv run --locked --group web pytest --cov=agent_platform --cov-report=term-missing --cov-report=xml
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  container:
    name: Compose and failure recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      APP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and start application and database
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check all endpoints and image build identity
        run: python scripts/smoke.py --commit "$APP_COMMIT"
      - name: Check graceful database failure
        run: |
          docker compose stop db
          python scripts/smoke.py --database-down --commit "$APP_COMMIT"
      - name: Check database recovery
        run: |
          docker compose up -d --wait --wait-timeout 60 db
          python scripts/smoke.py --commit "$APP_COMMIT"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up test containers
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish versioned image to GHCR
    needs: [checks, container]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate release version and image tags
        id: metadata
        run: python scripts/image_metadata.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: APP_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Run the published image by digest
        env:
          APP_IMAGE: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          APP_COMMIT: ${{ github.sha }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker compose pull app db
          docker compose up --no-build --wait --wait-timeout 120
          python scripts/smoke.py --commit "$APP_COMMIT" --version "$PACKAGE_VERSION"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "$APP_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Published image logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up published image test
        if: always()
        run: docker compose down --volumes
